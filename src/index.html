<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>三花猫桌宠</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main id="pet" aria-label="三花猫桌宠">
      <section id="monitor" class="monitor" aria-label="所有磁盘实时监测">
        <header class="monitor-head"><span>磁盘监测</span><span class="live-dot">● LIVE</span></header>
        <div class="summary-grid">
          <div class="summary-card"><span class="summary-title">CPU</span><span id="cpu-value" class="summary-value">--%</span><span class="summary-bar"><i id="cpu-bar"></i></span></div>
          <div class="summary-card"><span class="summary-title">RAM</span><span id="ram-value" class="summary-value">--%</span><span class="summary-bar ram"><i id="ram-bar"></i></span></div>
        </div>
        <div id="disk-list" class="disk-list" aria-live="polite"><div class="monitor-empty">正在检测磁盘…</div></div>
        <div class="metric-bottom"><span id="process-value">进程 --</span><span id="uptime-value">运行 --</span></div>
      </section>
      <div id="speech" class="speech" aria-live="polite"></div>
      <div id="effects" aria-hidden="true"></div>
      <canvas id="cat" width="64" height="64" aria-label="像素三花猫"></canvas>
    </main>
    <script src="../assets/sprite-map.js"></script>
    <script src="renderer.js"></script>
  </body>
</html>
